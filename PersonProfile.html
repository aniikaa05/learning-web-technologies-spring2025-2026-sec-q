<html>
    <head>
        <title>Person Profile Form</title>
    </head>
    <body>
       <form>
        <table border="1" width="100%"height="400"cellspacing="0">
            <tr>
                
                <th colspan="3">
                  <h2>PERSON PROFILE</h2>
                </th>
                
            </tr>
            <tr>
                <td>Name</td>
                <td><input type="text" name=""></td>
                <td width="25"></td>
            </tr>
             <tr>
                <td>Email</td>
                <td><input type="email" name=""></td>
                <td width="25"></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="" value="male"> Male
                    <input type="radio" name="" value="female"> Female
                    <input type="radio" name="" value="other"> Other
                </td>
                <td width="25"></td>
            </tr>
            <tr>
                <td>Date of Birth</td>
                <td>
                    <input type="text" name="">/
                    <input type="text" name="">/
                    <input type="text" name=""> 
                    <i>(dd/mm/yyyy)</i>
                </td>
                <td width="25"></td>
            </tr>
            <tr>
                <td>Blood Group</td>
                <td>
                    <select name="blood">
                        <option>A+</option>
                        <option>B+</option>
                        <option>AB+</option>
                        <option>O+</option>
                        <option>A-</option>
                        <option>B-</option>
                        <option>AB-</option>
                        <option>O-</option>
                    </select>
                </td>
                <td width="25"></td>
            </tr>
            <tr>
                <td>Degree</td>
                <td>
                    <input type="checkbox" name="" value="SSC"> SSC
                    <input type="checkbox" name="" value="HSC"> HSC
                    <input type="checkbox" name="" value="BSc."> BSc.
                    <input type="checkbox" name="" value="MSc."> MSc.
                </td>
                <td width="25"></td>
            </tr>
            <tr>
                <td>Photo</td>
                <td colspan="2"><input type="file" name=""></td>
            </tr>
            <tr>
                <td colspan="3" ><br></td>
            </tr>
            
            <tr>
                <td colspan="3" align="right">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
       </form>
    </body>
</html>
