<!DOCTYPE html>
<html>
<head>
    <title>Person Profile Form</title>
    <style>
        .error { color: red; }
    </style>
</head>
<body>
    <form >
        <table border="1" width="100%" height="400" cellspacing="0">
            <tr>
                <th colspan="3"><h2>PERSON PROFILE</h2></th>
            </tr>

            <tr>
                <td>Name</td>
                <td>
                    <input type="text" id="fullName">
                    <p id="errorName" class="error"></p>
                </td>
                <td width="25"></td>
            </tr>

            <tr>
                <td>Email</td>
                <td>
                    <input type="text" id="email">
                    <p id="errorEmail" class="error"></p>
                </td>
                <td width="25"></td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender" id="male" value="male"> Male
                    <input type="radio" name="gender" id="female" value="female"> Female
                    <input type="radio" name="gender" id="other" value="other"> Other
                    <p id="errorGender" class="error"></p>
                </td>
                <td width="25"></td>
            </tr>

            <tr>
                <td>Date of Birth</td>
                <td>
                    <input type="text" id="dobDay" size="2"> /
                    <input type="text" id="dobMonth" size="2"> /
                    <input type="text" id="dobYear" size="4">
                    <i>(dd/mm/yyyy)</i>
                    <p id="errorDob" class="error"></p>
                </td>
                <td width="25"></td>
            </tr>

            <tr>
                <td>Blood Group</td>
                <td>
                    <select id="blood">
                        <option value="">--Select--</option>
                        <option>A+</option>
                        <option>B+</option>
                        <option>AB+</option>
                        <option>O+</option>
                        <option>A-</option>
                        <option>B-</option>
                        <option>AB-</option>
                        <option>O-</option>
                    </select>
                    <p id="errorBlood" class="error"></p>
                </td>
                <td width="25"></td>
            </tr>

            <tr>
                <td>Degree</td>
                <td>
                    <input type="checkbox" id="ssc" value="SSC"> SSC
                    <input type="checkbox" id="hsc" value="HSC"> HSC
                    <input type="checkbox" id="bsc" value="BSc."> BSc.
                    <input type="checkbox" id="msc" value="MSc."> MSc.
                    <p id="errorDegree" class="error"></p>
                </td>
                <td width="25"></td>
            </tr>

            <tr>
                <td>User ID</td>
                <td>
                    <input type="number" id="userId" min="1">
                    <p id="errorUserId" class="error"></p>
                </td>
                <td width="25"></td>
            </tr>

            <tr>
                <td>Photo</td>
                <td colspan="2">
                    <input type="file" id="photo">
                    <p id="errorPhoto" class="error"></p>
                </td>
            </tr>

            <tr>
                <td colspan="3" align="right">
                    <input type="button" value="Submit" id="submitBtn">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>

    <script src="script.js"></script>
</body>
</html>
